name: Continuous Integration

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist-sdist .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist-sdist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: wheels / ${{ matrix.cfg.id }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { id: linux-x86_64, os: ubuntu-24.04, arch: x86_64 }
          - { id: linux-aarch64, os: ubuntu-24.04-arm, arch: aarch64 }
          - { id: macos-arm64, os: macos-15, arch: arm64 }
          - { id: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { id: windows-AMD64, os: windows-2025, arch: AMD64 }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Install R-macOS GNU Fortran 14.2
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gfortran.tar.xz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/R-macos/gcc-14-branch/releases/download/gcc-14.2-darwin-r2.1/gfortran-14.2-darwin20-r2-universal.tar.xz
          echo "adf14be50fa59e8cdd3d67ee727556e6b7559949101065d8218628c46e896903  $archive" | shasum -a 256 -c -
          sudo tar -xJf "$archive" -C /
          sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /opt/gfortran/SDK
          /opt/gfortran/bin/gfortran --version

      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Log UCRT64 toolchain
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc --version
          gfortran --version
          cmake --version
          ninja --version

      - uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.cfg.arch }}
          MHM_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        with:
          output-dir: dist-wheel-${{ matrix.cfg.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.cfg.id }}
          path: dist-wheel-${{ matrix.cfg.id }}/*.whl
          if-no-files-found: error

  upload_to_pypi:
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to Test PyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.test_pypi_api_token }}
          repository_url: https://test.pypi.org/legacy/
          skip_existing: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_api_token }}
